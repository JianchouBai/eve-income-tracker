<!doctype html>
<html lang='zh-CN'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='csrf-token' content='{{ csrf_token }}'>
  <title>EVE 每日收益</title>
</head>
<body>
  <main>
    <h1>EVE 每日收益</h1>
    {% if configuration_issues %}
    <p>请先配置以下环境变量：</p>
    <ul>{% for name in configuration_issues %}<li>{{ name }}</li>{% endfor %}</ul>
    {% else %}
    <a href='/auth/login'>{{ '添加角色' if authenticated else '登录 EVE' }}</a>
    {% if authenticated %}<p>角色数据已就绪。</p>{% endif %}
    {% endif %}
  </main>
</body>
</html>
