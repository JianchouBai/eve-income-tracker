[project]
name = 'eve-income-tracker'
dynamic = ['version']
requires-python = '>=3.11'

[tool.setuptools.dynamic]
version = {attr = 'app.__version__'}

[tool.pytest.ini_options]
testpaths = ['tests']
# Starlette's import-time fallback warns for our pinned httpx; no httpx2 migration here.
filterwarnings = [
    'ignore:^Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.$:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient',
]

[tool.ruff]
target-version = 'py311'
